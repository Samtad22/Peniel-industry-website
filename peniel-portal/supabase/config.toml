# Supabase CLI configuration (local development with `npx supabase start`).
# The hosted project is configured in the Supabase dashboard — see README.md
# "Supabase dashboard settings"; keep the two in step.
project_id = "peniel-portal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
# Invite-only: nobody can create their own account (CLAUDE.md rule 5).
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[auth.email.template.invite]
subject = "You're invited to the Peniel Portal"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Peniel Portal password"
content_path = "./supabase/templates/recovery.html"
