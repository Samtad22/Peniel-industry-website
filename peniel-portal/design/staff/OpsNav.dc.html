<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-8e4fea89-7cd3-449c-91d3-15c3f72c6f38/styles.css">
<script src="_ds/modernist-8e4fea89-7cd3-449c-91d3-15c3f72c6f38/_ds_bundle.js"></script>
</helmet>
<aside style="background:var(--color-text);color:var(--color-bg);display:flex;flex-direction:column;min-height:100%;height:100%;width:232px;font-size:14px">
<div style="display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:2px solid var(--color-neutral-800)"><img src="peniel-industry/public/img/logo-icon.png" alt="" style="width:28px;height:28px;background:var(--color-bg)"><b style="font-size:16px">Peniel Ops</b></div>
<div style="padding:12px 16px 14px;border-bottom:2px solid var(--color-neutral-800)"><div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.6">Viewing as role</div><div style="display:flex;justify-content:space-between;align-items:center;font-weight:800;border:1px solid var(--color-neutral-600);padding:8px 10px;margin-top:6px;cursor:pointer"><span>{{ roleLabel }}</span><span style="opacity:.7">▾</span></div></div>
<nav style="display:flex;flex-direction:column;padding:8px 0">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="8"><a href="{{ it.href }}" style="{{ it.style }}"><span>{{ it.label }}</span><span style="{{ it.badgeStyle }}">{{ it.badge }}</span></a></sc-for>
</nav>
<div style="padding:0 20px;font-size:11px;opacity:.5">{{ hiddenNote }}</div>
<div style="margin-top:auto;padding:14px 20px;border-top:2px solid var(--color-neutral-800);display:flex;gap:10px;align-items:center;font-size:12px"><span style="width:28px;height:28px;background:var(--color-accent);display:grid;place-items:center;font-weight:800;font-size:11px">{{ initials }}</span><span style="line-height:1.3"><b>{{ userName }}</b><br><span style="opacity:.65">{{ shift }}</span></span></div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:760},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;sales&quot;,&quot;production&quot;,&quot;quality&quot;,&quot;warehouse&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;inbox&quot;,&quot;orders&quot;,&quot;production&quot;,&quot;quality&quot;,&quot;inventory&quot;,&quot;artwork&quot;,&quot;documents&quot;,&quot;customers&quot;,&quot;messages&quot;,&quot;maintenance&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ALL = [
  ['dashboard','Dashboard','#1a'],['inbox','Order inbox','#1c'],['orders','Orders','#1e'],['production','Production','#1h'],
  ['quality','Quality control','#1i'],['inventory','Inventory','#1k'],['artwork','Artwork','#1m'],['documents','Documents','#1n'],
  ['customers','Customers','#1o'],['messages','Messages','#1q'],['maintenance','Maintenance','#1r'],['settings','Settings','#1s'],
];
const ROLES = {
  admin:{label:'Admin',items:ALL.map(a => a[0]),user:'Birtukan Abebe',ini:'BA',shift:'Admin · all areas'},
  sales:{label:'Sales & customer service',items:['dashboard','inbox','orders','artwork','documents','customers','messages'],user:'Selam Haile',ini:'SH',shift:'Sales & CS'},
  production:{label:'Production',items:['dashboard','orders','production','inventory','maintenance'],user:'Abebe Girma',ini:'AG',shift:'Shift B · 14:00–22:00'},
  quality:{label:'Quality',items:['dashboard','orders','production','quality','artwork','documents'],user:'Hanna Tesfaye',ini:'HT',shift:'QC lab'},
  warehouse:{label:'Warehouse',items:['dashboard','orders','inventory','documents'],user:'Yonas Bekele',ini:'YB',shift:'Warehouse · FG & raw'},
};
const BADGE = {inbox:'3',messages:'5',quality:'1'};
class Component extends DCLogic {
  renderVals() {
    const r = ROLES[this.props.role ?? 'admin'] || ROLES.admin;
    const active = this.props.active ?? 'dashboard';
    const items = ALL.filter(a => r.items.includes(a[0])).map(([k, label, href]) => {
      const on = k === active;
      const b = BADGE[k] || '';
      return {label, href: k === 'dashboard' && (this.props.role === 'production') ? '#1b' : href,
        style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 20px',color:'var(--color-bg)',textDecoration:'none',background:on ? 'var(--color-accent)' : 'transparent',fontWeight:on ? 800 : 400},
        badge:b, badgeStyle:{display:b ? 'inline-block' : 'none',fontSize:11,fontWeight:800,padding:'1px 7px',background:on ? 'var(--color-bg)' : 'var(--color-accent)',color:on ? 'var(--color-text)' : 'var(--color-bg)'}};
    });
    const hidden = ALL.length - items.length;
    return {items, roleLabel:r.label, userName:r.user, initials:r.ini, shift:r.shift,
      hiddenNote: hidden ? hidden + ' areas hidden for this role' : 'All areas visible'};
  }
}
</script>
</body>
</html>
